services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: depotin
      POSTGRES_PASSWORD: depotin
      POSTGRES_DB: depotin
    ports:
      - "54329:5432"
    volumes:
      - dbdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depotin -d depotin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
