version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: sqlc
        out: db/sqlc
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: pg_catalog.time
            go_type: string
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: int32
              pointer: true
          - db_type: pg_catalog.int8
            nullable: true
            go_type:
              type: int64
              pointer: true
          - db_type: pg_catalog.float8
            nullable: true
            go_type:
              type: float64
              pointer: true
          - db_type: pg_catalog.bool
            nullable: true
            go_type:
              type: bool
              pointer: true
          - db_type: pg_catalog.time
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: jsonb
            go_type:
              type: "[]byte"
          - db_type: inet
            nullable: true
            go_type:
              import: net/netip
              type: Prefix
              pointer: true
