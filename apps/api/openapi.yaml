openapi: 3.1.0
info:
  title: Depotin API
  version: 1.0.0
  description: API untuk sistem depot air minum isi ulang.
servers:
  - url: /api/v1
paths:
  /readyz:
    get:
      operationId: readyz
      summary: Memeriksa kesiapan API dan basis data
      responses:
        "200":
          description: Siap
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Readiness"
        "503":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Galat baku
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Readiness:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [ok]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - validation_failed
            - unauthenticated
            - forbidden
            - not_found
            - conflict
            - invalid_transition
            - rate_limited
            - internal
            - unavailable
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    Cursor:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
