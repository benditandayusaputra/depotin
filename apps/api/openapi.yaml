openapi: 3.1.0
info:
  title: Depotin API
  version: 1.0.0
  description: API untuk sistem depot air minum isi ulang.
servers:
  - url: /api/v1
paths:
  /readyz:
    get:
      operationId: readyz
      summary: Memeriksa kesiapan API dan basis data
      responses:
        "200":
          description: Siap
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Readiness"
        "503":
          $ref: "#/components/responses/Error"
  /auth/register:
    post:
      operationId: register
      summary: Mendaftarkan depot baru beserta pemiliknya
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Depot dibuat dan sesi dipasang di cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      summary: Masuk dengan nomor HP dan kata sandi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Berhasil masuk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Menukar token penyegar dengan sesi baru
      responses:
        "200":
          description: Sesi diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagResponse"
        "401":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: Keluar dari perangkat ini
      responses:
        "200":
          description: Keluar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagResponse"
  /auth/logout-all:
    post:
      operationId: logoutAll
      summary: Keluar dari semua perangkat
      responses:
        "200":
          description: Keluar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagResponse"
        "401":
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: me
      summary: Pengguna dan depot yang sedang masuk
      responses:
        "200":
          description: Sesi aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Error"
  /auth/password:
    post:
      operationId: changePassword
      summary: Mengganti kata sandi sendiri
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Kata sandi diganti
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagResponse"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /depot:
    get:
      operationId: getDepot
      summary: Profil depot pemilik
      responses:
        "200":
          description: Depot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepotResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateDepot
      summary: Mengubah pengaturan depot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepotUpdate"
      responses:
        "200":
          description: Depot diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepotResponse"
        "422":
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      summary: Daftar pemilik dan kurir depot
      responses:
        "200":
          description: Daftar pengguna
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
    post:
      operationId: createCourier
      summary: Menambah akun kurir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourierRequest"
      responses:
        "201":
          description: Kurir dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "422":
          $ref: "#/components/responses/Error"
  /users/{id}:
    patch:
      operationId: updateUser
      summary: Mengubah nama atau status aktif pengguna
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Pengguna diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      summary: Menyetel ulang kata sandi kurir
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 10
                  maxLength: 128
      responses:
        "200":
          description: Kata sandi disetel ulang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagResponse"
        "404":
          $ref: "#/components/responses/Error"
  /products:
    get:
      operationId: listProducts
      summary: Daftar produk depot
      responses:
        "200":
          description: Daftar produk
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      summary: Menambah produk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: Produk dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "422":
          $ref: "#/components/responses/Error"
  /products/{id}:
    patch:
      operationId: updateProduct
      summary: Mengubah produk
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Produk diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /customers:
    get:
      operationId: listCustomers
      summary: Daftar atau pencarian pelanggan
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 60
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, due, at_risk, loan]
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Daftar pelanggan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
    post:
      operationId: createCustomer
      summary: Menambah pelanggan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreate"
      responses:
        "201":
          description: Pelanggan dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "422":
          $ref: "#/components/responses/Error"
  /customers/{id}:
    get:
      operationId: getCustomer
      summary: Rincian pelanggan
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Pelanggan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateCustomer
      summary: Mengubah pelanggan
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Pelanggan diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /customers/{id}/link:
    post:
      operationId: getCustomerLink
      summary: Mengambil link pribadi pelanggan, membuatnya bila belum ada
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Link pribadi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkResponse"
        "404":
          $ref: "#/components/responses/Error"
  /customers/{id}/link/rotate:
    post:
      operationId: rotateCustomerLink
      summary: Membuat link pribadi baru dan mematikan yang lama
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Link baru
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkResponse"
        "404":
          $ref: "#/components/responses/Error"
  /customers/{id}/snooze:
    post:
      operationId: snoozeCustomer
      summary: Menunda pengingat pelanggan beberapa hari
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days:
                  type: integer
                  minimum: 1
                  maximum: 30
      responses:
        "200":
          description: Ditunda
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [snoozed_until]
                    properties:
                      snoozed_until:
                        type: string
                        format: date
        "404":
          $ref: "#/components/responses/Error"
  /orders:
    get:
      operationId: listOrders
      summary: Daftar pesanan depot
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: courier_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Daftar pesanan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
    post:
      operationId: createOrder
      summary: Membuat pesanan atas nama pelanggan
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
      responses:
        "201":
          description: Pesanan dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "200":
          description: Pesanan yang sama sudah dibuat sebelumnya dengan Idempotency-Key ini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "422":
          $ref: "#/components/responses/Error"
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Rincian pesanan
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Pesanan, pemilik menerima Order dan kurir menerima CourierOrder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "404":
          $ref: "#/components/responses/Error"
  /orders/{id}/confirm:
    post:
      operationId: confirmOrder
      summary: Mengonfirmasi pesanan menunggu
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Order"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /orders/{id}/assign:
    post:
      operationId: assignCourier
      summary: Menugaskan kurir
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courier_id]
              properties:
                courier_id:
                  type: string
                  format: uuid
      responses:
        "200":
          $ref: "#/components/responses/Order"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /orders/{id}/dispatch:
    post:
      operationId: dispatchOrder
      summary: Kurir berangkat
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/Order"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      summary: Membatalkan pesanan dengan alasan
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 200
      responses:
        "200":
          $ref: "#/components/responses/Order"
        "409":
          $ref: "#/components/responses/Error"
  /orders/{id}/mark-paid:
    post:
      operationId: markOrderPaid
      summary: Menandai pesanan lunas
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_method:
                  $ref: "#/components/schemas/PaymentMethod"
      responses:
        "200":
          $ref: "#/components/responses/Order"
        "409":
          $ref: "#/components/responses/Error"
  /orders/{id}/deliver:
    post:
      operationId: deliverOrder
      summary: Menyelesaikan pengantaran, menulis buku galon, loyalitas, dan prediksi
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gallons_returned]
              properties:
                gallons_returned:
                  type: integer
                  minimum: 0
                payment_method:
                  $ref: "#/components/schemas/PaymentMethod"
                paid:
                  type: boolean
      responses:
        "200":
          $ref: "#/components/responses/Order"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /customers/{id}/orders:
    get:
      operationId: listCustomerOrders
      summary: Riwayat pesanan seorang pelanggan
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Daftar pesanan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
  /customers/{id}/ledger:
    get:
      operationId: listCustomerLedger
      summary: Buku galon seorang pelanggan
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Buku galon
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LedgerEntry"
                  meta:
                    $ref: "#/components/schemas/Cursor"
        "404":
          $ref: "#/components/responses/Error"
  /customers/{id}/ledger-adjustments:
    post:
      operationId: adjustCustomerLedger
      summary: Penyesuaian manual buku galon
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, delta, note]
              properties:
                kind:
                  type: string
                  enum: [adjustment, lost]
                delta:
                  type: integer
                  description: Positif menambah galon di pelanggan, negatif mengurangi
                note:
                  type: string
                  minLength: 3
                  maxLength: 200
      responses:
        "201":
          description: Catatan ditambahkan
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/LedgerEntry"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /gallons/summary:
    get:
      operationId: gallonSummary
      summary: Total galon dipinjam dan daftar galon mengendap
      responses:
        "200":
          description: Ringkasan galon
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/GallonSummary"
  /courier/queue:
    get:
      operationId: courierQueue
      summary: Antrean antar kurir yang sedang masuk, terurut
      responses:
        "200":
          description: Antrean
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CourierOrder"
  /courier/customers/{id}/location:
    post:
      operationId: saveCustomerLocation
      summary: Menyimpan koordinat pelanggan dari HP kurir
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat:
                  type: number
                lng:
                  type: number
      responses:
        "200":
          description: Tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagResponse"
        "404":
          $ref: "#/components/responses/Error"
  /public/depots/{slug}:
    get:
      operationId: publicDepot
      summary: Halaman publik depot, di-cache 30 detik dengan ETag
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Depot dan produk aktif
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PublicDepotPage"
        "304":
          description: Tidak berubah
        "404":
          $ref: "#/components/responses/Error"
  /public/depots/{slug}/orders:
    post:
      operationId: publicOrder
      summary: Pesanan dari halaman publik, berstatus menunggu konfirmasi
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicOrderCreate"
      responses:
        "201":
          $ref: "#/components/responses/CreatedOrder"
        "200":
          $ref: "#/components/responses/CreatedOrder"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /public/track/{token}:
    get:
      operationId: trackOrder
      summary: Pelacakan satu pesanan
      parameters:
        - $ref: "#/components/parameters/Token"
      responses:
        "200":
          $ref: "#/components/responses/Track"
        "404":
          $ref: "#/components/responses/Error"
  /public/track/{token}/cancel:
    post:
      operationId: cancelTrackedOrder
      summary: Pelanggan membatalkan pesanan yang masih menunggu
      parameters:
        - $ref: "#/components/parameters/Token"
      responses:
        "200":
          $ref: "#/components/responses/Track"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /public/me/{token}:
    get:
      operationId: personalPage
      summary: Halaman pribadi pelanggan
      parameters:
        - $ref: "#/components/parameters/Token"
      responses:
        "200":
          description: Ringkasan pelanggan, pesanan aktif, lima riwayat terakhir
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PersonalPage"
        "404":
          $ref: "#/components/responses/Error"
  /public/me/{token}/orders:
    post:
      operationId: reorder
      summary: Pesan ulang satu ketukan dari link pribadi
      parameters:
        - $ref: "#/components/parameters/Token"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                qty:
                  type: integer
                  minimum: 1
                  maximum: 50
                scheduled_date:
                  type: string
                  format: date
                  description: Hari ini atau besok
                note:
                  type: string
                  maxLength: 300
                r:
                  type: string
                  format: uuid
                  description: ID pengingat dari link di pesan WhatsApp
      responses:
        "201":
          $ref: "#/components/responses/CreatedOrder"
        "200":
          $ref: "#/components/responses/CreatedOrder"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
components:
  parameters:
    Token:
      name: token
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        maxLength: 100
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    CreatedOrder:
      description: Kode dan token pelacakan pesanan
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: "#/components/schemas/CreatedOrder"
    Track:
